<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test SharePoint REST API - Firmy</title>
    <!-- Office.js API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 12px;
            background-color: #faf9f8;
            color: #323130;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 2px solid #0078d4;
            padding-bottom: 6px;
        }
        h3 {
            margin: 0;
            color: #0078d4;
            font-size: 15px;
        }
        .count-badge {
            background: #e1dfdd;
            color: #323130;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }
        .loading {
            color: #605e5c;
            font-style: italic;
            font-size: 13px;
        }
        .card-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e1dfdd;
            border-left: 4px solid #0078d4;
            border-radius: 4px;
            padding: 10px;
            box-shadow: 0 1.6px 3.6px 0 rgba(0,0,0,.132);
        }
        .card-title {
            font-weight: 600;
            font-size: 13px;
            color: #201f1e;
        }
        .card-details {
            font-size: 11px;
            color: #605e5c;
            margin-top: 4px;
        }
        .error {
            background: #fde7e9;
            color: #a80000;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h3>Baza Firm (SharePoint)</h3>
        <span id="badge" class="count-badge">...</span>
    </div>

    <div id="status" class="loading">Inicjalizacja dodatku...</div>
    <div id="gallery" class="card-container"></div>

    <script>
        // =========================================================
        // PARAMETRY TWOJEJ LISTY SHAREPOINT
        // =========================================================
        const SHAREPOINT_SITE_URL = "https://mescocompl.sharepoint.com/sites/CRMSystemPOC";
        const SHAREPOINT_LIST_NAME = "Firmy";
        // =========================================================

        Office.onReady(function(info) {
            if (info.host === Office.HostType.Outlook) {
                document.getElementById('status').innerText = 'Pobieranie listy firm...';
                fetchCompanies();
            } else {
                // Pozwala na szybki podgląd w zwykłej przeglądarce podczas testów
                document.getElementById('status').innerText = 'Testowanie poza Outlookiem...';
                fetchCompanies();
            }
        });

        async function fetchCompanies() {
            // Zapytanie OData: Pobieramy ID, Tytuł (Nazwę firmy) oraz Datę utworzenia
            const endpoint = `${SHAREPOINT_SITE_URL}/_api/web/lists/getbytitle('${SHAREPOINT_LIST_NAME}')/items?$select=ID,Title,Created&$top=15&$orderby=Title asc`;

            try {
                const response = await fetch(endpoint, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json;odata=nometadata',
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include' // Wykorzystuje aktywne zalogowanie do Office 365
                });

                if (!response.ok) {
                    throw new Error(`Błąd HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                document.getElementById('status').style.display = 'none';
                
                renderGallery(data.value);

            } catch (error) {
                console.error("Błąd SharePoint REST API:", error);
                showError(`Błąd pobierania danych: ${error.message}`);
            }
        }

        function renderGallery(items) {
            const galleryDiv = document.getElementById('gallery');
            const badge = document.getElementById('badge');
            galleryDiv.innerHTML = '';

            if (!items || items.length === 0) {
                galleryDiv.innerHTML = '<p class="loading">Brak firm na liście.</p>';
                badge.innerText = '0';
                return;
            }

            badge.innerText = items.length;

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const createdDate = new Date(item.Created).toLocaleDateString('pl-PL');

                card.innerHTML = `
                    <div class="card-title">${escapeHtml(item.Title || 'Brak nazwy')}</div>
                    <div class="card-details">ID wpisu: #${item.ID} | Dodano: ${createdDate}</div>
                `;
                
                galleryDiv.appendChild(card);
            });
        }

        function showError(message) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'error';
            statusDiv.innerText = message;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
