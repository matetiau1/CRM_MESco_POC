<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CRM Notes</title>
    <style>
        body { font-family: Segoe UI, sans-serif; background: #faf9f8; padding: 12px; margin: 0; }
        h2 { color: #0078d4; font-size: 14px; margin: 0 0 12px 0; }
        .badge { background: #e1dfdd; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; float: right; margin-top: 2px; }
        .status { background: #dffcf0; color: #107c10; padding: 8px; border-radius: 4px; margin-bottom: 12px; font-size: 12px; }
        .card { background: white; border: 1px solid #e1dfdd; border-left: 4px solid #0078d4; padding: 10px; margin-bottom: 8px; border-radius: 4px; }
        .card-title { font-weight: 600; font-size: 13px; color: #201f1e; margin-bottom: 4px; }
        .card-meta { font-size: 11px; color: #605e5c; }
    </style>
</head>
<body>
    <h2>CRM Notes <span class="badge">3</span></h2>
    
    <div class="status">✅ Demo version</div>
    
    <div class="card">
        <div class="card-title">Firma A Sp. z o.o.</div>
        <div class="card-meta">ID: #1 | Dodano: 2024-01-15</div>
    </div>
    
    <div class="card">
        <div class="card-title">Firma B - Consulting</div>
        <div class="card-meta">ID: #2 | Dodano: 2024-01-16</div>
    </div>
    
    <div class="card">
        <div class="card-title">Firma C GmbH</div>
        <div class="card-meta">ID: #3 | Dodano: 2024-01-17</div>
    </div>
</body>
</html>
